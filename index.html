<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EvenHold</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1f2a; }
      #app { width: 100%; height: 100%; display: block; }
      #hud {
        position: fixed;
        top: 10px;
        left: 12px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        pointer-events: none;
      }
      #hud div {
        font-family: monospace;
        font-size: 13px;
        color: #e8e8e8;
        background: rgba(0, 0, 0, 0.35);
        padding: 4px 8px;
        border-radius: 4px;
      }
      /* Dev cheat menu: a centered RPG panel in voxel style. Carved wooden
         frame with grain, iron rivets and a gem, textured parchment, a red
         ribbon banner, rows with pixel-art icons, a gold selection glow. */
      #cheat-backdrop {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle, rgba(30, 18, 8, 0.35), rgba(20, 12, 6, 0.7));
        z-index: 20;
      }
      #cheat-backdrop[hidden] { display: none; }
      #cheat-panel {
        position: relative;
        width: min(400px, calc(100vw - 48px));
        padding: 38px 26px 20px;
        color: #3e2818;
        font-family: Georgia, 'Times New Roman', serif;
        /* Parchment with faint fibres and a darker rim. */
        background:
          repeating-linear-gradient(0deg, rgba(120, 84, 40, 0.05) 0 2px, transparent 2px 5px),
          repeating-linear-gradient(90deg, rgba(120, 84, 40, 0.04) 0 3px, transparent 3px 7px),
          radial-gradient(circle at 50% 40%, #f3e2bd, #e2c996 75%, #cfb07a);
        /* Wooden frame in stepped layers, with a hard voxel drop shadow. */
        box-shadow:
          0 0 0 4px #8a6038,
          0 0 0 8px #5a3a22,
          0 0 0 12px #3a281c,
          12px 12px 0 12px rgba(0, 0, 0, 0.35),
          inset 0 0 0 3px #caa876;
        animation: cheat-pop 0.24s steps(4) both;
      }
      #cheat-panel::before {
        /* Wood grain along the frame. */
        content: '';
        position: absolute;
        inset: -12px;
        z-index: -1;
        background: repeating-linear-gradient(90deg, #6e4a2c 0 6px, #5f3f25 6px 9px, #74502f 9px 14px);
      }
      @keyframes cheat-pop {
        from { transform: scale(0.8); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      .cheat-rivet {
        position: absolute;
        width: 8px;
        height: 8px;
        background: #9aa0a8;
        box-shadow: inset -2px -2px 0 #5c6068, inset 2px 2px 0 #d4d8de;
      }
      .cheat-gem {
        position: absolute;
        bottom: -18px;
        left: 50%;
        width: 16px;
        height: 16px;
        transform: translateX(-50%) rotate(0deg);
        background: #3dbdb8;
        box-shadow: 0 0 0 4px #3a281c, inset -4px -4px 0 #217c98, inset 4px 4px 0 #9be8da, 0 0 14px rgba(61, 189, 184, 0.7);
      }
      #cheat-panel h2 {
        position: absolute;
        top: -26px;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        padding: 8px 30px;
        font-size: 19px;
        letter-spacing: 0.18em;
        font-weight: normal;
        color: #fbeccb;
        text-shadow: 2px 2px 0 #5e2419;
        white-space: nowrap;
        background: linear-gradient(#a8513c 0 4px, #8b3a2b 4px calc(100% - 4px), #6e2a1f calc(100% - 4px));
        box-shadow: 0 0 0 4px #4a1a12, 6px 6px 0 4px rgba(0, 0, 0, 0.3);
      }
      #cheat-panel h2::before,
      #cheat-panel h2::after {
        /* Notched ribbon tails. */
        content: '';
        position: absolute;
        top: 10px;
        width: 22px;
        height: 100%;
        background: #6e2a1f;
        box-shadow: 0 0 0 4px #4a1a12;
        z-index: -1;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 8px 50%);
      }
      #cheat-panel h2::before { left: -30px; }
      #cheat-panel h2::after { right: -30px; transform: scaleX(-1); }
      #cheat-panel .cheat-row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        margin: 10px 0;
        padding: 8px 10px;
        font: inherit;
        text-align: left;
        color: #3e2818;
        cursor: pointer;
        border: 0;
        background: linear-gradient(#e2c690, #d2b27a);
        box-shadow: inset 0 3px 0 #efdcae, inset 0 -3px 0 #a7864f, 0 4px 0 #6e4e2c;
        transition: transform 0.08s steps(2);
      }
      #cheat-panel .cheat-row.selected {
        background: linear-gradient(#f2d99c, #e4c47f);
        box-shadow: inset 0 3px 0 #fbeabf, inset 0 -3px 0 #b8914f, 0 4px 0 #6e4e2c, 0 0 0 3px #f0c64a, 0 0 16px rgba(240, 198, 74, 0.55);
        transform: translateX(6px);
      }
      #cheat-panel .cheat-row.selected::before {
        /* Pixel pointer arrow. */
        content: '';
        position: absolute;
        left: -20px;
        top: 50%;
        width: 10px;
        height: 14px;
        margin-top: -7px;
        background: #f0c64a;
        clip-path: polygon(0 0, 100% 50%, 0 100%);
        filter: drop-shadow(2px 2px 0 #5a3a22);
      }
      #cheat-panel .cheat-row:active { transform: translate(6px, 3px); }
      #cheat-panel .cheat-row.on .cheat-icon { background: #b9d18a; box-shadow: inset 0 0 0 3px #56703a; }
      .cheat-icon {
        flex: none;
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        background: #f5e6c4;
        box-shadow: inset 0 0 0 3px #5a3a22, inset 3px 3px 0 3px #fff4d8;
      }
      .cheat-icon svg { width: 28px; height: 28px; shape-rendering: crispEdges; }
      .cheat-text { flex: 1; display: flex; flex-direction: column; gap: 2px; }
      .cheat-text b { font-size: 15px; font-weight: bold; letter-spacing: 0.02em; }
      .cheat-text small { font-size: 12px; font-style: italic; opacity: 0.75; }
      #cheat-panel kbd {
        flex: none;
        min-width: 24px;
        padding: 3px 0;
        text-align: center;
        font-family: monospace;
        font-size: 13px;
        color: #f5e6c4;
        background: #5a3a22;
        box-shadow: inset 0 -3px 0 #3a281c, inset 0 3px 0 #76502f;
      }
      #cheat-panel .cheat-status {
        min-height: 1.3em;
        margin-top: 16px;
        padding: 6px;
        font-size: 13px;
        font-style: italic;
        text-align: center;
        background: rgba(90, 58, 34, 0.1);
        box-shadow: inset 0 0 0 2px rgba(90, 58, 34, 0.25);
      }
      #cheat-panel .cheat-hint { margin-top: 10px; font-size: 12px; text-align: center; opacity: 0.7; }
      #cheat-panel .cheat-hint kbd { min-width: 20px; margin: 0 2px; font-size: 11px; }
      /* Loading screen: plain HTML/CSS (plus a tiny inline script building
         the voxel island), so it paints before the game bundle arrives. Its
         animations are CSS transforms, which keep running on the compositor
         while the world is being built. */
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(circle at 50% 42%, #fbe7d2, #eec5a2 55%, #d9a57f);
        color: #4a3222;
        font-family: Georgia, 'Times New Roman', serif;
        transition: opacity 0.7s ease;
        z-index: 10;
        overflow: hidden;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading h1 {
        margin: 0;
        font-size: 46px;
        font-weight: normal;
        letter-spacing: 0.1em;
        color: #5a3a22;
        text-shadow: 2px 2px 0 #d9a57f, 4px 4px 0 #b9825c, 6px 6px 0 rgba(90, 58, 34, 0.25);
      }
      .stage { width: 260px; height: 230px; display: flex; align-items: center; justify-content: center; animation: bob 3.2s ease-in-out infinite; }
      #island { position: relative; width: 0; height: 0; transform-style: preserve-3d; animation: turn 26s linear infinite; }
      .v { position: absolute; transform-style: preserve-3d; }
      .v > i { position: absolute; left: 0; top: 0; width: 20px; height: 20px; transform-origin: 0 0; }
      @keyframes turn { from { transform: rotateX(58deg) rotateZ(0deg); } to { transform: rotateX(58deg) rotateZ(360deg); } }
      @keyframes bob { 0%, 100% { transform: translateY(6px); } 50% { transform: translateY(-6px); } }
      #loading-bar { display: flex; gap: 4px; }
      #loading-bar span {
        width: 18px;
        height: 18px;
        background: rgba(90, 58, 34, 0.14);
        box-shadow: inset 0 -4px 0 rgba(90, 58, 34, 0.12);
        transition: background 0.2s ease, transform 0.2s ease;
      }
      #loading-bar span.on { background: #e0b54e; box-shadow: inset 0 -4px 0 #b88a32, inset 0 4px 0 #f5d98a; transform: translateY(-3px); }
      #loading-step { font-size: 15px; font-style: italic; min-height: 1.2em; opacity: 0.85; }
      @media (prefers-reduced-motion: reduce) { .stage, #island { animation: none; } #island { transform: rotateX(58deg) rotateZ(35deg); } }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="loading">
      <div class="stage"><div id="island"></div></div>
      <h1>EvenHold</h1>
      <div id="loading-bar"></div>
      <div id="loading-step">Waking the realm…</div>
    </div>
    <script>
      // The loading screen's voxel island, as CSS 3D cubes: grass and dirt,
      // a half-timbered house, an oak, wheat, a pool and the hero. Faces hidden
      // behind a neighbour aren't drawn; each face gets a fixed shade.
      (function () {
        var S = 20;
        var C = { grass: '#62ad4c', dirt: '#7d5838', stone: '#8e8b82', plaster: '#e9dfc6', timber: '#3a281c', roof: '#9b4a32', ridge: '#b65c3c',
          trunk: '#5c4030', leaf: '#468744', leafLight: '#5c9f4c', wheat: '#e0bb52', water: '#3dbdb8', hero: '#e8823c', head: '#f5e4c8', door: '#5a3a22' };
        var voxels = {};
        function put(x, y, z, c) { voxels[x + ',' + y + ',' + z] = c; }
        for (var x = 0; x < 7; x++) for (var y = 0; y < 7; y++) {
          if ((x === 0 || x === 6) && (y === 0 || y === 6)) continue; // rounded-off corners, still square voxels
          put(x, y, 0, 'dirt');
          if (!(x >= 5 && y <= 2 && !(x === 6 && y === 0))) put(x, y, 1, 'grass');
        }
        put(5, 1, 1, 'water'); put(5, 2, 1, 'water'); put(6, 1, 1, 'water'); put(6, 2, 1, 'water');
        for (var hx = 1; hx <= 3; hx++) for (var hy = 1; hy <= 2; hy++) for (var hz = 2; hz <= 3; hz++) {
          put(hx, hy, hz, hz === 2 && hx === 2 && hy === 2 ? 'door' : (hx === 2 ? 'plaster' : 'timber'));
        }
        for (var rx = 0; rx <= 4; rx++) { put(rx, 1, 4, 'roof'); put(rx, 2, 4, 'roof'); put(rx, 1, 5, 'ridge'); }
        put(3, 1, 6, 'stone');
        put(5, 5, 2, 'trunk'); put(5, 5, 3, 'trunk');
        for (var lx = 4; lx <= 6; lx++) for (var ly = 4; ly <= 6; ly++) put(lx, ly, 4, 'leaf');
        put(5, 5, 5, 'leafLight'); put(4, 5, 5, 'leaf'); put(5, 4, 5, 'leaf'); put(5, 5, 6, 'leafLight');
        put(1, 4, 2, 'wheat'); put(1, 5, 2, 'wheat'); put(2, 5, 2, 'wheat'); put(2, 4, 2, 'wheat');
        put(4, 3, 2, 'hero'); put(4, 3, 3, 'head');

        function shade(hex, k) {
          var n = parseInt(hex.slice(1), 16);
          var r = Math.round(((n >> 16) & 255) * k), g = Math.round(((n >> 8) & 255) * k), b = Math.round((n & 255) * k);
          return 'rgb(' + r + ',' + g + ',' + b + ')';
        }
        // [neighbour offset, face transform, shade]
        var faces = [
          [[0, 0, 1], 'translateZ(' + S + 'px)', 1],
          [[0, -1, 0], 'rotateX(90deg)', 0.66],
          [[0, 1, 0], 'translateY(' + S + 'px) rotateX(90deg)', 0.78],
          [[-1, 0, 0], 'rotateY(-90deg)', 0.72],
          [[1, 0, 0], 'translateX(' + S + 'px) rotateY(-90deg)', 0.86],
        ];
        var island = document.getElementById('island');
        Object.keys(voxels).forEach(function (key) {
          var p = key.split(',').map(Number);
          var color = C[voxels[key]];
          var cube = document.createElement('div');
          cube.className = 'v';
          cube.style.transform = 'translate3d(' + (p[0] - 3.5) * S + 'px,' + (p[1] - 3.5) * S + 'px,' + p[2] * S + 'px)';
          faces.forEach(function (f) {
            if (voxels[(p[0] + f[0][0]) + ',' + (p[1] + f[0][1]) + ',' + (p[2] + f[0][2])]) return; // hidden
            var face = document.createElement('i');
            face.style.transform = f[1];
            face.style.background = shade(color, f[2]);
            cube.appendChild(face);
          });
          island.appendChild(cube);
        });
        var bar = document.getElementById('loading-bar');
        for (var i = 0; i < 12; i++) bar.appendChild(document.createElement('span'));
      })();
    </script>
    <div id="hud">
      <div id="seed-label"></div>
      <div id="fps-label"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
