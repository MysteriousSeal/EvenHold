<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EvenHold</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1f2a; }
      #app { width: 100%; height: 100%; display: block; }
      #hud {
        position: fixed;
        bottom: 10px;
        left: 12px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        pointer-events: none;
      }
      #hud div {
        font-family: monospace;
        font-size: 13px;
        color: #e8e8e8;
        background: rgba(0, 0, 0, 0.35);
        padding: 4px 8px;
        border-radius: 4px;
      }
      /* Loading screen: plain HTML/CSS in the game's own look (sand, clay,
         ink, Fredoka), so it paints before the game bundle arrives: a sun
         glowing over rows of stepped hills drifting by, motes rising. Only
         transforms and opacity animate, so it stays smooth on the compositor
         while the world is built. */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 40%, #f8ecd4, #efdcb8 50%, #d6bb8e);
        color: #2e1f14;
        font-family: 'Fredoka', system-ui, sans-serif;
        transition: opacity 0.6s ease;
        overflow: hidden;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading-stage {
        position: relative;
        width: min(560px, 90vw);
        height: 230px;
        overflow: hidden;
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
        mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
      }
      /* The sun, a soft glow that slowly breathes. */
      #loading-stage .sun {
        position: absolute;
        left: 50%;
        top: 22px;
        width: 150px;
        height: 150px;
        margin-left: -75px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff3c8 0 22%, rgba(255, 217, 138, 0.75) 36%, rgba(255, 217, 138, 0) 70%);
        animation: breathe 5s ease-in-out infinite;
      }
      /* Three rows of stepped hills drifting by, the nearer the faster. */
      #loading-stage .hills {
        position: absolute;
        left: 0;
        bottom: 0;
        width: calc(100% + 480px); /* one pattern wider than the view, */
        height: 120px;
        background-repeat: repeat-x;
        background-position: left bottom;
        animation: drift linear infinite;
        will-change: transform;
      }
      #loading-stage .far { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='480' height='120' viewBox='0 0 480 120'><path d='M0,120 L0,70 L60,70 L60,58 L100,58 L100,48 L160,48 L160,56 L200,56 L200,66 L280,66 L280,52 L320,52 L320,44 L380,44 L380,54 L420,54 L420,64 L480,64 L480,120 Z' fill='%23b7cf9a'/></svg>"); animation-duration: 40s; bottom: 34px; }
      #loading-stage .mid { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='480' height='120' viewBox='0 0 480 120'><path d='M0,120 L0,86 L50,86 L50,76 L90,76 L90,68 L140,68 L140,78 L200,78 L200,88 L240,88 L240,74 L290,74 L290,64 L350,64 L350,74 L390,74 L390,82 L440,82 L440,86 L480,86 L480,120 Z' fill='%238bbf6a'/></svg>"); animation-duration: 24s; bottom: 12px; }
      #loading-stage .near { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='480' height='120' viewBox='0 0 480 120'><path d='M0,120 L0,104 L40,104 L40,96 L100,96 L100,90 L140,90 L140,100 L200,100 L200,108 L240,108 L240,98 L300,98 L300,92 L340,92 L340,102 L400,102 L400,106 L440,106 L440,104 L480,104 L480,120 Z' fill='%235f9f4c'/></svg>"); animation-duration: 13s; }
      /* Golden motes rising and fading. */
      #loading-stage .mote {
        position: absolute;
        bottom: 20px;
        width: 5px;
        height: 5px;
        background: #ffd98a;
        box-shadow: 0 0 6px #ffd98a;
        opacity: 0;
        animation: rise 6s ease-in infinite;
      }
      #loading-stage .mote:nth-child(5) { left: 22%; animation-delay: 0s; }
      #loading-stage .mote:nth-child(6) { left: 38%; animation-delay: 1.5s; }
      #loading-stage .mote:nth-child(7) { left: 55%; animation-delay: 3s; }
      #loading-stage .mote:nth-child(8) { left: 71%; animation-delay: 4.5s; }
      #loading-stage .mote:nth-child(9) { left: 46%; animation-delay: 2.2s; }
      @keyframes breathe { 0%, 100% { transform: scale(0.94); opacity: 0.85; } 50% { transform: scale(1.06); opacity: 1; } }
      @keyframes drift { to { transform: translateX(-480px); } } /* and shifted by exactly one pattern: a seamless loop */
      @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 0.9; } 100% { transform: translateY(-170px); opacity: 0; } }
      #loading h1 {
        margin: 0;
        font-size: 60px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #a4502f;
        text-shadow: 0 4px 0 #7a3520, 0 7px 0 rgba(46, 31, 20, 0.35);
      }
      #loading-bar {
        width: 320px;
        height: 22px;
        background: #7a3520;
        border: 3px solid #2e1f14;
        box-shadow: 3px 3px 0 rgba(46, 31, 20, 0.35);
      }
      #loading-bar i {
        display: block;
        width: 0;
        height: 100%;
        background: #ffd98a;
        box-shadow: inset 0 -5px 0 #e8903a, inset 0 3px 0 rgba(255, 255, 255, 0.35);
        transition: width 0.25s ease;
      }
      #loading-step { font-size: 17px; font-weight: 600; min-height: 1.2em; }
      #loading-tip {
        max-width: 420px;
        min-height: 1.2em;
        padding: 6px 14px;
        font-size: 14px;
        text-align: center;
        color: #f8ecd4;
        background: rgba(38, 26, 17, 0.9);
        border: 2px solid #efdcb8;
        box-shadow: 3px 3px 0 rgba(46, 31, 20, 0.35);
      }
      #loading-tip:empty { visibility: hidden; }
      @media (prefers-reduced-motion: reduce) { #loading-stage * { animation: none !important; } }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="loading">
      <div id="loading-stage"><div class="sun"></div><div class="hills far"></div><div class="hills mid"></div><div class="hills near"></div><i class="mote"></i><i class="mote"></i><i class="mote"></i><i class="mote"></i><i class="mote"></i></div>
      <h1>EvenHold</h1>
      <div id="loading-bar"><i></i></div>
      <div id="loading-step">Waking the realm…</div>
      <div id="loading-tip"></div>
    </div>
    <div id="hud">
      <div id="version-label"></div>
      <div id="seed-label"></div>
      <div id="position-label"></div>
      <div id="fps-label"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
