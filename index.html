<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EvenHold</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1f2a; }
      #app { width: 100%; height: 100%; display: block; }
      #hud {
        position: fixed;
        top: 10px;
        left: 12px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        pointer-events: none;
      }
      #hud div {
        font-family: monospace;
        font-size: 13px;
        color: #e8e8e8;
        background: rgba(0, 0, 0, 0.35);
        padding: 4px 8px;
        border-radius: 4px;
      }
      /* Loading screen: plain HTML/CSS (plus a tiny inline script building
         the voxel island), so it paints before the game bundle arrives. Its
         animations are CSS transforms, which keep running on the compositor
         while the world is being built. */
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(circle at 50% 42%, #fbe7d2, #eec5a2 55%, #d9a57f);
        color: #4a3222;
        font-family: Georgia, 'Times New Roman', serif;
        transition: opacity 0.7s ease;
        z-index: 10;
        overflow: hidden;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading h1 {
        margin: 0;
        font-size: 46px;
        font-weight: normal;
        letter-spacing: 0.1em;
        color: #5a3a22;
        text-shadow: 2px 2px 0 #d9a57f, 4px 4px 0 #b9825c, 6px 6px 0 rgba(90, 58, 34, 0.25);
      }
      .stage { width: 260px; height: 230px; display: flex; align-items: center; justify-content: center; animation: bob 3.2s ease-in-out infinite; }
      #island { position: relative; width: 0; height: 0; transform-style: preserve-3d; animation: turn 26s linear infinite; }
      .v { position: absolute; transform-style: preserve-3d; }
      .v > i { position: absolute; left: 0; top: 0; width: 20px; height: 20px; transform-origin: 0 0; }
      @keyframes turn { from { transform: rotateX(58deg) rotateZ(0deg); } to { transform: rotateX(58deg) rotateZ(360deg); } }
      @keyframes bob { 0%, 100% { transform: translateY(6px); } 50% { transform: translateY(-6px); } }
      #loading-bar { display: flex; gap: 4px; }
      #loading-bar span {
        width: 18px;
        height: 18px;
        background: rgba(90, 58, 34, 0.14);
        box-shadow: inset 0 -4px 0 rgba(90, 58, 34, 0.12);
        transition: background 0.2s ease, transform 0.2s ease;
      }
      #loading-bar span.on { background: #e0b54e; box-shadow: inset 0 -4px 0 #b88a32, inset 0 4px 0 #f5d98a; transform: translateY(-3px); }
      #loading-step { font-size: 15px; font-style: italic; min-height: 1.2em; opacity: 0.85; }
      @media (prefers-reduced-motion: reduce) { .stage, #island { animation: none; } #island { transform: rotateX(58deg) rotateZ(35deg); } }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="loading">
      <div class="stage"><div id="island"></div></div>
      <h1>EvenHold</h1>
      <div id="loading-bar"></div>
      <div id="loading-step">Waking the realm…</div>
    </div>
    <script>
      // The loading screen's voxel island, as CSS 3D cubes: grass and dirt,
      // a half-timbered house, an oak, wheat, a pool and the hero. Faces hidden
      // behind a neighbour aren't drawn; each face gets a fixed shade.
      (function () {
        var S = 20;
        var C = { grass: '#62ad4c', dirt: '#7d5838', stone: '#8e8b82', plaster: '#e9dfc6', timber: '#3a281c', roof: '#9b4a32', ridge: '#b65c3c',
          trunk: '#5c4030', leaf: '#468744', leafLight: '#5c9f4c', wheat: '#e0bb52', water: '#3dbdb8', hero: '#e8823c', head: '#f5e4c8', door: '#5a3a22' };
        var voxels = {};
        function put(x, y, z, c) { voxels[x + ',' + y + ',' + z] = c; }
        for (var x = 0; x < 7; x++) for (var y = 0; y < 7; y++) {
          if ((x === 0 || x === 6) && (y === 0 || y === 6)) continue; // rounded-off corners, still square voxels
          put(x, y, 0, 'dirt');
          if (!(x >= 5 && y <= 2 && !(x === 6 && y === 0))) put(x, y, 1, 'grass');
        }
        put(5, 1, 1, 'water'); put(5, 2, 1, 'water'); put(6, 1, 1, 'water'); put(6, 2, 1, 'water');
        for (var hx = 1; hx <= 3; hx++) for (var hy = 1; hy <= 2; hy++) for (var hz = 2; hz <= 3; hz++) {
          put(hx, hy, hz, hz === 2 && hx === 2 && hy === 2 ? 'door' : (hx === 2 ? 'plaster' : 'timber'));
        }
        for (var rx = 0; rx <= 4; rx++) { put(rx, 1, 4, 'roof'); put(rx, 2, 4, 'roof'); put(rx, 1, 5, 'ridge'); }
        put(3, 1, 6, 'stone');
        put(5, 5, 2, 'trunk'); put(5, 5, 3, 'trunk');
        for (var lx = 4; lx <= 6; lx++) for (var ly = 4; ly <= 6; ly++) put(lx, ly, 4, 'leaf');
        put(5, 5, 5, 'leafLight'); put(4, 5, 5, 'leaf'); put(5, 4, 5, 'leaf'); put(5, 5, 6, 'leafLight');
        put(1, 4, 2, 'wheat'); put(1, 5, 2, 'wheat'); put(2, 5, 2, 'wheat'); put(2, 4, 2, 'wheat');
        put(4, 3, 2, 'hero'); put(4, 3, 3, 'head');

        function shade(hex, k) {
          var n = parseInt(hex.slice(1), 16);
          var r = Math.round(((n >> 16) & 255) * k), g = Math.round(((n >> 8) & 255) * k), b = Math.round((n & 255) * k);
          return 'rgb(' + r + ',' + g + ',' + b + ')';
        }
        // [neighbour offset, face transform, shade]
        var faces = [
          [[0, 0, 1], 'translateZ(' + S + 'px)', 1],
          [[0, -1, 0], 'rotateX(90deg)', 0.66],
          [[0, 1, 0], 'translateY(' + S + 'px) rotateX(90deg)', 0.78],
          [[-1, 0, 0], 'rotateY(-90deg)', 0.72],
          [[1, 0, 0], 'translateX(' + S + 'px) rotateY(-90deg)', 0.86],
        ];
        var island = document.getElementById('island');
        Object.keys(voxels).forEach(function (key) {
          var p = key.split(',').map(Number);
          var color = C[voxels[key]];
          var cube = document.createElement('div');
          cube.className = 'v';
          cube.style.transform = 'translate3d(' + (p[0] - 3.5) * S + 'px,' + (p[1] - 3.5) * S + 'px,' + p[2] * S + 'px)';
          faces.forEach(function (f) {
            if (voxels[(p[0] + f[0][0]) + ',' + (p[1] + f[0][1]) + ',' + (p[2] + f[0][2])]) return; // hidden
            var face = document.createElement('i');
            face.style.transform = f[1];
            face.style.background = shade(color, f[2]);
            cube.appendChild(face);
          });
          island.appendChild(cube);
        });
        var bar = document.getElementById('loading-bar');
        for (var i = 0; i < 12; i++) bar.appendChild(document.createElement('span'));
      })();
    </script>
    <div id="hud">
      <div id="seed-label"></div>
      <div id="fps-label"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
