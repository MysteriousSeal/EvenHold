<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EvenHold</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1f2a; }
      #app { width: 100%; height: 100%; display: block; }
      #hud {
        position: fixed;
        top: 10px;
        left: 12px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        pointer-events: none;
      }
      #hud div {
        font-family: monospace;
        font-size: 13px;
        color: #e8e8e8;
        background: rgba(0, 0, 0, 0.35);
        padding: 4px 8px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hud">
      <div id="seed-label"></div>
      <div id="fps-label"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
