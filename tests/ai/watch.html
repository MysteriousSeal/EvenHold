<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EvenHold · the fighter</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1f2a; }
      #app { width: 100%; height: 100%; display: block; }
      #panel {
        position: fixed;
        top: 16px;
        left: 16px;
        width: 330px;
        padding: 12px 14px;
        font: 500 14px/1.45 Fredoka, system-ui, sans-serif;
        color: #f8ecd4;
        background: #3a332c;
        border: 3px solid #2e1f14;
        box-shadow: inset 0 3px 0 #2a2420, 0 3px 0 #1c1612;
        pointer-events: none;
      }
      #panel b { display: block; font-size: 18px; font-weight: 700; margin-bottom: 4px; }
      #panel .row { display: flex; justify-content: space-between; }
      #panel .dim { color: #c9b8a0; }
      #panel .won { color: #8fd36a; }
      #panel .fell { color: #ff7b5c; }
      #panel .keys { margin-top: 8px; font-size: 12px; color: #c9b8a0; }
      #panel .bar { height: 8px; background: #2a2420; margin: 2px 0 6px; }
      #panel .bar i { display: block; height: 100%; background: #8fd36a; }
      #panel .move { font-size: 22px; font-weight: 700; }
      /* The keys the AI presses, as a player's: lit while held (a tap a moment longer, to be seen). */
      #keys {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: grid;
        grid-template-columns: repeat(4, 54px) 24px 54px 54px;
        grid-template-rows: 54px 54px 54px;
        gap: 6px;
        pointer-events: none;
        font: 700 16px Fredoka, system-ui, sans-serif;
      }
      #keys div {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        line-height: 1.1;
        color: #c9b8a0;
        background: #3a332c;
        border: 3px solid #2e1f14;
        box-shadow: inset 0 -4px 0 #2a2420, 0 3px 0 #1c1612;
        transition: background 0.08s, color 0.08s, transform 0.08s;
      }
      #keys div small { font-size: 10px; font-weight: 500; }
      #keys div.on { color: #2e1f14; background: #ffd96a; box-shadow: inset 0 -4px 0 #e0a830, 0 1px 0 #1c1612; transform: translateY(2px); }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="panel">Loading the fighter…</div>
    <div id="keys"></div>
    <script type="module" src="./watch.ts"></script>
  </body>
</html>
